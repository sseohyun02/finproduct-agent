<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>금융상품 Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #f5f5f4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #api-url {
    font-size: 12px;
    font-weight: 400;
    color: #888;
    margin-left: auto;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #e5e5e5; border-bottom-left-radius: 4px; }
  .bot.loading { color: #999; font-style: italic; }
  .bot.error { border-color: #f0a; color: #b00; }
  .trace-toggle { font-size: 11px; color: #888; cursor: pointer; margin-top: 6px; display: inline-block; }
  .trace-box { font-size: 11px; color: #666; background: #f8f8f6; border-radius: 6px; padding: 8px; margin-top: 6px; white-space: pre-wrap; display: none; }
  .trace-box.show { display: block; }
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    background: #fff;
    border-top: 1px solid #ddd;
  }
  #q {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #ccc;
    font-size: 14px;
    outline: none;
  }
  #q:focus { border-color: #3b82f6; }
  #send {
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled { background: #ccc; cursor: default; }
  #settings {
    padding: 6px 20px;
    background: #fffbea;
    border-bottom: 1px solid #eee;
    font-size: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #settings input { flex: 1; font-size: 12px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; }
</style>
</head>
<body>

<div id="header">
  금융상품 Agent
  <span id="api-url"></span>
</div>

<div id="settings">
  <span>서버 주소:</span>
  <input id="server-input" value="http://49.50.134.182:8000" />
  <button id="save-server" style="font-size:12px; padding:4px 10px; cursor:pointer;">적용</button>
</div>

<div id="chat"></div>

<div id="inputbar">
  <input id="q" type="text" placeholder="예: 위험등급 5 이상 채권" autocomplete="off" />
  <button id="send">전송</button>
</div>

<script>
let SERVER = localStorage.getItem('agentServer') || 'http://49.50.134.182:8000';
document.getElementById('server-input').value = SERVER;
document.getElementById('api-url').textContent = SERVER;

document.getElementById('save-server').onclick = () => {
  SERVER = document.getElementById('server-input').value.trim().replace(/\/$/, '');
  localStorage.setItem('agentServer', SERVER);
  document.getElementById('api-url').textContent = SERVER;
};

const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');
let qCounter = 1;

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addBotMsg(answer, thinkTrace, context) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.textContent = answer;

  if (thinkTrace || context) {
    const toggle = document.createElement('span');
    toggle.className = 'trace-toggle';
    toggle.textContent = '추론 과정 보기';
    const box = document.createElement('div');
    box.className = 'trace-box';
    box.textContent = (thinkTrace ? '[think_trace]\n' + thinkTrace : '') +
      (context ? '\n\n[retrieved_context]\n' + context : '');
    toggle.onclick = () => {
      box.classList.toggle('show');
      toggle.textContent = box.classList.contains('show') ? '추론 과정 숨기기' : '추론 과정 보기';
    };
    div.appendChild(toggle);
    div.appendChild(box);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendQuestion() {
  const question = qInput.value.trim();
  if (!question) return;

  addMsg(question, 'user');
  qInput.value = '';
  sendBtn.disabled = true;

  const loadingDiv = addMsg('답변 생성 중...', 'bot loading');

  try {
    const qid = 'UI-' + String(qCounter++).padStart(3, '0');
    const url = SERVER + '/answer?question_id=' + encodeURIComponent(qid) +
      '&question=' + encodeURIComponent(question);
    const res = await fetch(url);
    if (!res.ok) throw new Error('서버 응답 오류: ' + res.status);
    const data = await res.json();

    loadingDiv.remove();
    addBotMsg(data.answer || '(답변 없음)', data.think_trace, data.retrieved_context);
  } catch (err) {
    loadingDiv.remove();
    addMsg('오류: ' + err.message + '\n(서버 주소나 CORS 설정을 확인하세요)', 'bot error');
  } finally {
    sendBtn.disabled = false;
    qInput.focus();
  }
}

sendBtn.onclick = sendQuestion;
qInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendQuestion();
});

addBotMsg('금융상품에 대해 질문해 보세요. 예: "위험등급 5 이상 채권", "삼성전자 담은 ETF"', null, null);
</script>

</body>
</html>
